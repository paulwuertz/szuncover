[project]
name = "szuncover"
version = "0.1.0"
description = "Uncover stack-usages for your threads"
long_description = """

Stack size
===========

Estimate stack usage in RTOS threads when compiling with GCC -callgraph-info=cu,da option.

From all .ci files a calltree with stack use for each function is constructed.

Given a config file a list of threads and associtated stack sizes a report will be generated to each threads stack utilization.

For dynamic function-calls not know at compile-time a list of dynamic-calls can complete this missing parts of the runtime callgraph to get better results in the estimation."""
authors = [
    { name = "Paul Würtz", email = "paulwuertz@posteo.de" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
]
dynamic = ["classifiers"]

[project.scripts]
szuncover = "szuncover.szuncover:main"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
preview = true
line-length = 100

[build-system]
# use the poetry build backend, which enables automatic classifier generation
# see https://github.com/astral-sh/uv/issues/8716
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "codecov==2.1.13",
    "tox==3.27.1; python_version < '3.12'",
    "tox==4.11.3; python_version >= '3.12'",
    "setuptools>=75",
    "ruff>=0.12.10",
    "pydantic>=2.13.3",
]

[tool.poetry]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
]
packages = [{ include = "szuncover" }]
include = [
    { path = "szuncover/*", format = ["wheel", "sdist"] },
]
exclude = ["tests"]

[tox]
envlist=py3

[testenv]
deps =
    setuptools-scm
    pydantic
    mypy
    ruff
setenv =
    TOXTEMPDIR={envtmpdir}
commands =
  python -m unittest # {posargs:tests}
  # TODO to many doubts about optional missing fields... rewritable?
  # python -m mypy --config-file={toxinidir}/tox.ini --package=szuncover
  ruff format

[mypy]
mypy_path=szuncover
ignore_missing_imports=True

